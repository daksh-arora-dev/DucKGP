[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kgp-student-assistant"
version = "0.1.0"
description = "Modular IIT KGP student assistant powered by LangChain and MCP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastmcp>=2.14.0,<3.0",
    "langchain>=1.0,<2.0",
    "langchain-mcp-adapters>=0.3.2,<0.4.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0,<2.0"]
dev = ["pytest>=8.0,<10.0", "ruff>=0.8,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kgp_student_assistant = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
